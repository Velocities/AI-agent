apiVersion: ai-agent.tool/v1
name: count-words
version: 0.1.0
description: Count words, and words longer than three characters, in a text string.
nix:
  attr: count-words
entrypoint: count-words
interface:
  stdin: json
  stdout: json
  input:
    type: object
    required: [text]
    properties:
      text:
        type: string
  output:
    type: object
    required: [words, notable]
    properties:
      words:
        type: integer
      notable:
        type: integer
