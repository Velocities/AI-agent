[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
description = "Self-hosted AI server administration agent with argv-based command execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "amdsmi>=6.4.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "nvidia-ml-py>=12.0",
    "psutil>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
mqtt = [
    "paho-mqtt>=2.1",
]
# CPU speech only. faster-whisper and Kokoro are future swaps, not this extra.
voice = [
    "piper-tts>=1.2.0,<2",
    "vosk>=0.3.45",
]

[project.scripts]
ai-agent = "ai_agent.cli.app:main"
ai-agent-llm = "ai_agent.cli.llm_serve:main"
ai-agent-serve = "ai_agent.api.serve:main"

[tool.setuptools.packages.find]
where = [".", "clients/cli"]
include = ["ai_agent*", "ai_agent_cli*"]

[tool.setuptools.package-data]
ai_agent = [
    "conversations/alembic.ini",
    "conversations/alembic/env.py",
    "conversations/alembic/script.py.mako",
    "conversations/alembic/versions/*.py",
    "policy/*.yaml",
    "apk/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: live Docker daemon tests (skipped if docker is unavailable)",
    "voice_live: transcription and synthesis against local Vosk and Piper models",
]
