[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
dynamic = ["version"]
description = "Self-hosted AI server administration agent with argv-based command execution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/Velocities/AI-agent"
Source = "https://github.com/Velocities/AI-agent"
Issues = "https://github.com/Velocities/AI-agent/issues"
Releases = "https://github.com/Velocities/AI-agent/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ai-agent = "ai_agent.cli.app:main"
ai-agent-llm = "ai_agent.cli.llm_serve:main"
ai-agent-serve = "ai_agent.api.serve:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = [".", "clients/cli"]
include = ["ai_agent*", "ai_agent_cli*"]

[tool.setuptools.package-data]
ai_agent = [
    "conversations/alembic.ini",
    "conversations/alembic/env.py",
    "conversations/alembic/script.py.mako",
    "conversations/alembic/versions/*.py",
    "policy/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: live Docker daemon tests (skipped if docker is unavailable)",
]
