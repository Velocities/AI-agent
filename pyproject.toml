[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
description = "Self-hosted AI server administration agent with argv-based command execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ai-agent = "ai_agent.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
