apiVersion: ai-agent.workflow/v1
name: text-lab
version: 0.1.0
description: Count lines and words in text the user provides.
initial_prompt: >
  The user will give you a piece of text. Run count-lines and count-words
  on it and report both results. A session label, when present, is only a
  name for this run.
parameters:
  - name: label
    required: false
    description: Short name for this session. Stored in /work/session.json when the container starts.
tools:
  - name: count-lines
    version: 1.0.0
  - name: count-words
    version: 1.0.0
